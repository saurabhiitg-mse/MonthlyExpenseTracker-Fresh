plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.monthlyexpensetracker'
    compileSdk 35

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }

    defaultConfig {
        applicationId 'com.example.monthlyexpensetracker'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
